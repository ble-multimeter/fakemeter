[project]
name = "fakemeter"
description = "BLE peripheral emulator that impersonates Bluetooth multimeters for hardware-free decode verification"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mannes", email = "info@mbtech.nl" }]
keywords = ["ble", "bluetooth", "bluetooth-low-energy", "bluez", "gatt", "multimeter", "emulator", "peripheral"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Hardware",
    "Topic :: System :: Networking",
]
dynamic = ["version"]
dependencies = ["bluezero>=0.9.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/ble-multimeter/fakemeter"
Repository = "https://github.com/ble-multimeter/fakemeter"
Issues = "https://github.com/ble-multimeter/fakemeter/issues"

[project.scripts]
fakemeter = "fakemeter.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fakemeter", "fakemeter.profiles"]

[tool.setuptools.dynamic]
version = { attr = "fakemeter.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
