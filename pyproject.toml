[project]
name = "fakemeter"
version = "0.1.0"
description = "BLE peripheral emulator that impersonates Bluetooth multimeters for hardware-free decode verification"
requires-python = ">=3.10"
dependencies = ["bluezero>=0.9.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fakemeter", "fakemeter.profiles"]

[tool.pytest.ini_options]
testpaths = ["tests"]
